name=ShiftWS2811
version=2.1.0
author=Emiel Harmsen, Paul Stoffregen
maintainer=Emiel Harmsen
sentence=Drive 128 WS2811 LED chains in parallel through 74HC595 shift registers using FlexIO2 and DMA on Teensy 4.1
paragraph=ShiftWS2811 clocks LED data into eight chains of 74HC595 shift registers whose outputs are enabled only during the data phase of each WS2811 bit. FlexIO2 generates the shift clock, store and common waveforms with cycle accuracy and the eDMA feeds the shifters, so the CPU only converts colour data. Includes gamma correction, temporal dithering and triple buffering.
